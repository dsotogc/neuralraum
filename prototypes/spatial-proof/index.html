<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuralraum — Floor study 02</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; height:100vh; display:grid; place-items:center; color:#c0beb6; background:#101111; font:12px/1.5 ui-monospace,monospace }
  main { width:min(94vw, calc((100vh - 110px)*1.85),1500px) }
  header,footer { display:flex; align-items:center; justify-content:space-between; gap:16px }
  header { margin-bottom:12px }
  h1 { margin:0; font:600 19px/1 system-ui,sans-serif; letter-spacing:-.06em }
  small { letter-spacing:.14em; text-transform:uppercase }
  #view { position:relative; aspect-ratio:1000/540; background:#1c1d1c; border:1px solid #3c3c38 }
  canvas { display:block; width:100%; height:100% }
  #status { position:absolute; inset:0; display:grid; place-items:center; margin:0; padding:25px; text-align:center }
  [hidden] { display:none!important }
  footer { margin-top:10px; color:#a6a69e }
  b { color:#d5a576; font-weight:normal }
  button { color:inherit; background:none; border:0; font:inherit; cursor:pointer; padding:4px }
  button:hover,button:focus-visible { color:#f1c393 }
</style>
<main>
  <header><h1>Neuralraum</h1><small>02 / Floor study</small></header>
  <div id="view" role="img" aria-label="Elevated view across a club floor. Three figures arrive through the left doorway and cross toward the DJ booth."><p id="status" role="status">Opening the room…</p></div>
  <footer><span><b>CAM 01</b> &nbsp; Rear elevation</span><button onclick="location.reload()">↺ Replay</button></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.12.0/dist/pixi.min.js" defer></script>
<script src="scene.js" defer></script>
</html>
